<h1>Your Top Song</h1>

<div class="listening-stats">
    <h2>Your Most Played Track</h2>
    
    <div class="stats-box">
        <div class="stat-item">
            <h3>{{ track_name }}</h3>
            <p>by {{ artist_name }}</p>
        </div>
        
        <div class="stat-item">
            <h3>Song Duration</h3>
            <p>{{ minutes }} minutes and {{ seconds }} seconds</p>
        </div>
    </div>
    
    <p class="note">* This is your most played song in the medium-term period (approximately last 6 months)</p>
</div>
