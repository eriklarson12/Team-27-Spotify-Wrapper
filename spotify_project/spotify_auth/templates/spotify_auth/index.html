<!DOCTYPE html>
<html>
<head>
    <title>Spotify Profile Viewer</title>
    <style>
        .login-container {
            text-align: center;
            margin: 50px auto;
            max-width: 600px;
            padding: 20px;
        }

        .spotify-button {
            display: inline-block;
            background-color: #1DB954;
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }

        .spotify-button:hover {
            background-color: #1ed760;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Welcome to Spotify Profile Viewer</h1>
        <p>Connect with your Spotify account to view your profile and top tracks.</p>
        <a href="{% url 'spotify_login' %}" class="spotify-button">Log in with Spotify</a>
    </div>
</body>
</html>
