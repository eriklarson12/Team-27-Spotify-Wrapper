<h1>Your Spotify Profile</h1>

<div class="profile-info">
    <p><strong>Name:</strong> {{ profile.display_name }}</p>
    <p><strong>Email:</strong> {{ profile.email }}</p>
    <p><strong>Country:</strong> {{ profile.country }}</p>
    <p><strong>Spotify URL:</strong> <a href="{{ profile.external_urls.spotify }}">{{ profile.external_urls.spotify }}</a></p>
</div>

<div class="actions">
    <a href="{% url 'get_top_tracks' %}" class="spotify-button">View Your Top Tracks</a>
</div>
<div class="actions">
    <a href="{% url 'get_top_artists' %}" class="spotify-button">View Your Top Artists</a>
</div>
<div class="actions">
    <a href="{% url 'get_top_genre' %}" class="spotify-button">View Your Top Genre</a>
</div>
<div class="actions">
    <a href="{% url 'get_personality_insights' %}" class="spotify-button">View Your Personality Insights</a>
</div>
<div class="actions">
    <a href="{% url 'new_artists_discovered' %}" class="spotify-button">New Artists Discovered</a>
</div>

<style>
    .profile-info {
        margin: 20px 0;
    }
    
    .spotify-button {
        display: inline-block;
        background-color: #1DB954;
        color: white;
        padding: 12px 24px;
        border-radius: 24px;
        text-decoration: none;
        font-weight: bold;
        margin-top: 20px;
    }
    
    .spotify-button:hover {
        background-color: #1ed760;
    }
</style>
