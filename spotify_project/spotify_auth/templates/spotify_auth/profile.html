<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #191414;
            color: #ffffff;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
            position: fixed;
            height: 100%;
            width: 100%;
        }

        body.light-mode {
            background-color: #ffffff;
            color: #191414;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px 20px;
            gap: 20px;
        }

        .profile-title {
            display: block;
            font-size: 5rem;
            color: inherit;
            font-weight: bold;
            text-align: center;
            padding-top: 40px;
            padding-bottom: 40px;
            scale: 1.3;
        }

        .profile-title.light-mode {
            color: #191414;
        }
        .profile-title {
            animation: pulse 1.5s infinite alternate;
        }

        .generate-wrap-text {
            display: block;
            font-size: 2rem;
            color: #1DB954;
            font-weight: bold;
            text-align: center;
            padding-top: 5px;
            padding-bottom: 5px;
            text-decoration: none;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 1) !important;
        }
        .generate-wrap-text:hover {
            animation: pulse 1.5s infinite alternate;
        }

    @keyframes pulse {
        0% {
            transform: scale(1.00);
            text-shadow: 0 0 10px #fff;
        }
        100% {
            transform: scale(1.1);
            text-shadow: 0 0 20px #1DB954;
        }
    }


    .button {
        background: linear-gradient(45deg, #1DB954, #14833b);
        color: #ffffff;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        text-decoration: none;
    }

    .large-button {
        scale: 1.2;
    }

    button:hover {
        background-color: #14833b;
        transform: scale(1.05);
    }

        h1 {
            text-align: center;
            color: #1DB954;
            font-size: 36px;
            margin-bottom: 30px;
        }

        .actions {
            {#text-align: center;#}
            {#margin-top: 20px;#}
            display: flex;
            flex-direction: column;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            scale: 1.2;
        }


    .center-container {
        display: flex;
        height: 80%;
        align-content: center;
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
    }
    .bottom-bar {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        gap: 20%;
        padding-bottom: 20px;
    }

    .triangle {
        width: 0;
        height: 0;
        border-left: 50px solid transparent;
        border-right: 50px solid transparent;
        border-bottom: 100px solid rgba(255, 255, 0, 0.8);
        position: absolute;
        transform: scale(11) translateY(60px) rotate(70deg) translateX(2px) translateZ(0px);
        z-index: -1;
        left: 0;
    }

    .triangle2 {
        border-bottom: 100px solid rgba(121, 10, 240, 0.8) !important;
        transform: scale(11) translateY(-0px) rotate(-110deg) translateX(2px) translateZ(0px) !important;
        left: inherit;
        right: 0;
        top: 0;
    }

    .circle {
        width: 100px;
        height: 100px;
        background-color: red;
        position: absolute;
        border-radius: 50%;
        z-index: -1;
        bottom: 0;
        right: 0;
        transform: scale(6);
    }

    @media (max-width: 768px) {
        .center-container {
            transform: scale(0.8);
            transform-origin: center;
            top: 0;
            left: 0;
        }

        .button {
            font-size: 6px !important;
        }

        .top-bar {
            font-size: 6px !important;
        }
    }
        
    </style>
</head>

<body>
    <div class="top-bar">
        <button id="theme-toggle" class="button">Toggle Dark Mode</button>
        <a href="{% url 'logout' %}" class="button">Log Out</a>
        <a href="{{ profile.external_urls.spotify }}" class="button">View Spotify Page</a>
        <form method="POST" action="{% url 'delete_account' %}" style="display: inline;"
            onsubmit="return confirm('Are you sure you want to delete your account? This action cannot be undone.');">
            {% csrf_token %}
            <button type="submit" class="button">Delete Account</button>
        </form>
    </div>
    <div class="circle"></div>
    <div class="triangle"></div>
    <div class="triangle triangle2"></div>
    <div class="center-container">
        <div class="profile-title">Generate Your Wraps</div>

        <div class="actions">
            <a href="{% url 'spotify_wrap' %}?time_range=short_term" class="generate-wrap-text">
                Short Term Wrap
            </a>
            <a href="{% url 'spotify_wrap' %}?time_range=medium_term" class="generate-wrap-text">
                Medium Term Wrap
            </a>
            <a href="{% url 'spotify_wrap' %}?time_range=long_term" class="generate-wrap-text">
                Long Term Wrap
            </a>
        </div>
    </div>


    <div class="bottom-bar">
        <a href="{% url 'view_saved_wraps' %}" class="button large-button">View Saved Wraps</a>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.classList.add(savedTheme);
            updateButtonText(savedTheme);
        }

        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('light-mode');
            let currentTheme = 'dark-mode';
            if (document.body.classList.contains('light-mode')) {
                currentTheme = 'light-mode';
            }
            localStorage.setItem('theme', currentTheme);
            updateButtonText(currentTheme);
        });

        function updateButtonText(theme) {
            themeToggle.textContent = theme === 'light-mode' ? 'Toggle Dark Mode' : 'Toggle Light Mode';
        }
    </script>
</body>

</html>
