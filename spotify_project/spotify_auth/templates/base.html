<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Spotify{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #191414;
            color: #ffffff;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body.light-mode {
            background-color: #ffffff;
            color: #191414;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 10px 20px;
            background-color: #1DB954;
        }

        .theme-toggle-button {
            background-color: white;
            color: #1DB954;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .theme-toggle-button:hover {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <!-- Top bar with theme toggle button -->
    <div class="top-bar">
        <buttton><a href="{% url 'profile' %}">Profile</a></buttton>
        <button id="theme-toggle" class="theme-toggle-button">Toggle Dark Mode</button>
    </div>

    <!-- Content will be injected here -->
    {% block content %}
    {% endblock %}

    <!-- JavaScript for theme toggle -->
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        
        // Check local storage for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        
        if (savedTheme) {
            document.body.classList.add(savedTheme); // Apply saved theme
            updateButtonText(savedTheme);
        }

        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('light-mode'); // Toggle between light and dark mode
            
            let currentTheme = 'dark-mode'; // Default is dark mode
            if (document.body.classList.contains('light-mode')) {
                currentTheme = 'light-mode';
            }
            
            // Save the current theme in local storage
            localStorage.setItem('theme', currentTheme);

            // Update button text based on current theme
            updateButtonText(currentTheme);
        });

        function updateButtonText(theme) {
          if (theme === 'light-mode') {
              themeToggle.textContent = 'Toggle Dark Mode';
          } else {
              themeToggle.textContent = 'Toggle Light Mode';
          }
      }
      
        const slides = document.querySelectorAll('.slide');
    let currentSlide = 0;

    document.getElementById('next-button').addEventListener('click', () => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    });
    </script>

</body>
</html>
